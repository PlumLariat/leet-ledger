[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.6",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "djangorestframework>=3.17.1",
    "psycopg2-binary>=2.9.12",
]

[dependency-groups]
dev = [
    "coverage>=7.15.3",
    "ruff>=0.16.1",
]

[tool.coverage.run]
source = ["leetledger", "problems", "progress"]
omit = ["*/migrations/*", "*/tests.py", "*/settings.py", "*/asgi.py", "*/wsgi.py"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
